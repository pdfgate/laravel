name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.stability == 'prefer-lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        stability: ['prefer-stable']
        include:
          - php: '8.2'
            laravel: '12'
            stability: 'prefer-lowest'
        exclude:
          - php: '8.2'
            laravel: '13'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --dev --no-interaction --no-update
          composer update --no-interaction --no-progress --prefer-dist --${{ matrix.stability }} --prefer-stable

      - name: Run PHPStan
        run: composer run stan

      - name: Run unit tests
        run: composer run test
